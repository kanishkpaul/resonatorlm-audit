name: Numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify numerical identities and model behavior
        run: |
          python -m unittest discover -s tests -p 'test_kernel.py' -v
          python -m unittest discover -s tests -p 'test_model.py' -v
          python -m unittest discover -s tests -p 'test_ssm.py' -v
